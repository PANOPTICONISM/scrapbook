services:
  scrapbook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: scrapbook-server:latest
    container_name: scrapbook
    restart: unless-stopped
    ports:
      - "${PORT:-47291}:${PORT:-47291}"
    volumes:
      - ./data:/data
    environment:
      SCRAPBOOK_TOKEN: "${SCRAPBOOK_TOKEN:?Set SCRAPBOOK_TOKEN in docker/.env (see .env.example)}"
      DATABASE_URL: "sqlite:/data/scrapbook.db"
      PORT: "${PORT:-47291}"
      RUST_LOG: "${RUST_LOG:-scrapbook_server=info,tower_http=info}"
